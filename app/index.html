<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Murshid App - Automatic store redirect" />
  <title>Murshid | Redirecting to Store...</title>
  <link rel="icon" type="image/webp" href="../assets/logo-sq.webp" />
  <style>
    body {
      background-color: #0A0F1E;
      color: #FFFFFF;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loading-container {
      max-width: 400px;
      padding: 24px;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #10B981;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.25rem;
      margin-bottom: 8px;
    }
    p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="spinner"></div>
    <h2>Redirecting you to the store...</h2>
    <p>If you are not redirected automatically in a few seconds, <a href="../index.html" id="fallback-link" style="color: #10B981; text-decoration: underline;">click here to return to the main site</a>.</p>
  </div>

  <script>
    // ══════════════════════════════════════════════════
    // Murshid App Store Links
    // Replace placeholders with real links when available
    // ══════════════════════════════════════════════════
    const PLAY_STORE_URL = '#'; // Google Play Store Link (Android)
    const APP_STORE_URL  = '#'; // App Store Link (iPhone/iPad)
    const FALLBACK_URL   = '../index.html'; // Fallback URL for desktop

    function redirect() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      let targetUrl = FALLBACK_URL;

      if (/android/i.test(userAgent)) {
        targetUrl = PLAY_STORE_URL !== '#' ? PLAY_STORE_URL : FALLBACK_URL;
      } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        targetUrl = APP_STORE_URL !== '#' ? APP_STORE_URL : FALLBACK_URL;
      }

      // Update fallback link on page
      document.getElementById('fallback-link').href = targetUrl;

      // Execute redirect
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 1000); // Slight delay for visual loading effect
    }

    window.onload = redirect;
  </script>
</body>
</html>
